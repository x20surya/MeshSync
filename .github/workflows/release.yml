name: Release

# Everything a release ships is built here rather than on somebody's laptop, because the Windows
# daemon cannot be built anywhere else and a release assembled from three different machines is a
# release nobody can reproduce.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true

permissions:
  contents: write

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build the AppImage, the .deb and the tarball
        run: packaging/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: packaging/out/*
          if-no-files-found: error

  windows:
    name: Windows installer and portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Both Windows artifacts come out of one script, the way the three Linux ones come out of
      # packaging/build.sh - and for a reason this workflow learned the hard way. It used to run
      # `dotnet publish` here and upload `publish/WinDaemon.exe` from it, which looked right and
      # was not: a single-file publish leaves WPF's five native libraries in the directory beside
      # the .exe, so the file attached to every release from v0.1.0 to v0.6.0 was missing them.
      # It started, listened, advertised over Bluetooth, and never opened a window.
      #
      # build.ps1 asserts what it produced rather than trusting the exit code: the payload has the
      # native libraries in it, and the portable publish is one file and nothing else.
      - name: Build the installer and the portable executable
        shell: pwsh
        run: ./packaging/windows/build.ps1

      # By name, not the directory: build.ps1 leaves both publish trees in there so -SkipPublish
      # has something to skip locally, and uploading the directory would carry 400 MB of loose
      # DLLs into the artifact alongside the two files anybody wants.
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: packaging/windows/out/MeshSync-*
          if-no-files-found: error

  android:
    name: Android client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install the Android workload
        run: dotnet workload install maui-android

      # Signed with the CI debug key, which is what v0.1.0 shipped. A release key belongs here
      # the moment there is a store listing to need one.
      - name: Build
        run: >
          dotnet build src/AndroidClient/AndroidClient.csproj
          -c Release -f net10.0-android -t:SignAndroidPackage

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: src/AndroidClient/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Name the files after the tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p out
          cp artifacts/windows/*.msi                         "out/MeshSync-$TAG-windows-x64.msi"
          cp artifacts/windows/*.exe                         "out/MeshSync-$TAG-windows-x64.exe"
          cp artifacts/android/*-Signed.apk                  "out/MeshSync-$TAG-android.apk"
          cp artifacts/linux/*.AppImage                      "out/MeshSync-$TAG-linux-x86_64.AppImage"
          cp artifacts/linux/*.deb                           "out/MeshSync-$TAG-linux-amd64.deb"
          cp artifacts/linux/*.tar.xz                        "out/MeshSync-$TAG-linux-x64.tar.xz"
          ls -lh out

      # Published because the Windows build is not code-signed, so the download page has to tell
      # people they will get a SmartScreen warning - and telling somebody to click through a
      # security warning without giving them a way to check the file first is not advice.
      - name: Checksum every file
        run: |
          cd out
          sha256sum MeshSync-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Mesh Sync $TAG" --generate-notes
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber

  # Republish the apt repository from the release that was just made, so `apt upgrade` offers the
  # new version rather than the repository quietly staying a release behind.
  apt:
    name: APT repository
    needs: [publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/apt.yml
    secrets: inherit
