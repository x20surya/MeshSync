name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CoreLib and its tests are the part that has to be right, and the part that
  # builds anywhere. Running it on Linux keeps it honest about staying free of
  # platform references - the apps are where those belong.
  core:
    name: CoreLib and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # One project, not two: restore takes a single project or solution, and naming
      # both failed outright with MSB1008. The test project references CoreLib, so
      # restoring it restores both. The solution would not do - it holds the Android
      # project, which needs a workload this job deliberately does not install.
      - name: Restore
        run: dotnet restore tests/CoreLib.Tests/CoreLib.Tests.csproj

      # Warnings are errors here rather than a convention someone has to remember.
      # An incremental build does not re-report them, so this is a clean one every time.
      - name: Build
        run: dotnet build tests/CoreLib.Tests/CoreLib.Tests.csproj --no-restore -warnaserror

      - name: Test
        run: dotnet test tests/CoreLib.Tests/CoreLib.Tests.csproj --no-build --verbosity normal

  windows:
    name: Windows daemon
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build src/WinDaemon/WinDaemon.csproj -warnaserror

  desktop:
    name: Linux desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # The shared core, the headless daemon and the Avalonia shell. All three are plain
      # net10.0 and need no workload, which is the point of keeping the Linux and Mac heads
      # off MAUI.
      - name: Build
        run: dotnet build src/DesktopShell/DesktopShell.csproj -warnaserror

      - name: Build the headless daemon
        run: dotnet build src/LinuxDaemon/LinuxDaemon.csproj -warnaserror

  package:
    name: Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Builds the AppImage, the .deb and the tarball. Nothing here needs root, and
      # appimagetool is run with --appimage-extract-and-run because a CI runner has no FUSE.
      - name: Build packages
        run: packaging/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            packaging/out/*.AppImage
            packaging/out/*.deb
            packaging/out/*.tar.xz
          if-no-files-found: error

  macos:
    name: Mac desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # macOS is parked as a supported platform - nothing has ever launched this binary, and
      # docs/platform-matrix.md no longer claims it. The job stays because keeping the target
      # compiling costs one runner and is what makes picking it back up cheap; letting it rot
      # is what makes it expensive. Signing and notarising are not done here.
      - name: Build
        run: dotnet build src/DesktopShell/DesktopShell.csproj -r osx-arm64 -warnaserror

      - name: Publish
        run: dotnet publish src/DesktopShell/DesktopShell.csproj -c Release -r osx-arm64 --self-contained true

  android:
    name: Android client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install the Android workload
        run: dotnet workload install maui-android

      - name: Build
        run: dotnet build src/AndroidClient/AndroidClient.csproj -f net10.0-android -warnaserror
